services:
  - type: web
    name: plateq-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plateq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: plateq-db
    plan: free
    databaseName: plateq
    user: plateq_user
